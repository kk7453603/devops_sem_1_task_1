replicaCount: 2

image:
  repository: kirillkom/effective_go_app
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

service:
  name: myapp-service
  type: NodePort
  port: 8000
  nodePort: 30007

ingress:
  enabled: true
  ingressClassName: nginx
  hostname: myapp.local
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: tls
  annotations: {}

tls:
  crt: ""
  key: ""

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16"
  env:
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "test"
    POSTGRES_DB: "time_tracker"
  service:
    port: 5432
  persistence:
    size: "10Gi"
    storageClass: ""
  secret:
    existingSecret: ""

app:
  debug: "on"
  apiUrl: "http://localhost:8000/info"
  serviceUrl: ":8000"
  dbMigrationsPath: "file://internal/migrations"
  runMigrations: true

serviceAccount:
  create: true
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
  customMetrics: []

tolerations: []

networkPolicy:
  enabled: false

rbac:
  enabled: true

monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
    path: "/metrics"
    interval: "30s"
    scrapeTimeout: "10s"
    additionalLabels: {}

backup:
  enabled: false
  schedule: "0 2 * * *"
  storageSize: "50Gi"
  storageClass: ""

ingress-nginx:
  enabled: false